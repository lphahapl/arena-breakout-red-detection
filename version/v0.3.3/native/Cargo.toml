[package]
name = "ab-red-detect"
version = "0.3.3"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
percent-encoding = "2"
crc32fast = "1"
flate2 = "1"
windows = { version = "0.62.2", features = [
 "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging",
 "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi",
 "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_WinRT"
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
